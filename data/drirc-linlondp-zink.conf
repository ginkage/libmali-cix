<?xml version="1.0" standalone="yes"?>
<!-- CIX vendor stack: linlondp is display-only; render with zink (on libmali Vulkan) directly instead of
     kmsro, whose dumb-buffer scanout allocations fail on linlondp's render node. -->
<driconf>
    <device driver="loader" kernel_driver="linlondp">
        <application name="Default">
            <option name="dri_driver" value="zink" />
        </application>
    </device>
</driconf>
